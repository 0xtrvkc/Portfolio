name: Static Site Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate files, manifest, and local references
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import sys
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('.')
          required = [
              Path('index.html'),
              Path('firebase-sync.js'),
              Path('firestore.rules'),
              Path('portfolio-data.js'),
              Path('portfolio-store.js'),
              Path('manifest.json'),
              Path('icons/icon-192.png'),
              Path('icons/icon-512.png'),
          ]

          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              print('Missing required files:')
              for path in missing:
                  print(f'  - {path}')
              sys.exit(1)

          try:
              manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError) as exc:
              print(f'Invalid manifest.json: {exc}')
              sys.exit(1)

          manifest_errors = []
          for icon in manifest.get('icons', []):
              src = icon.get('src', '')
              if not src:
                  manifest_errors.append('manifest icon is missing src')
                  continue
              icon_path = root / src.removeprefix('./')
              if not icon_path.is_file():
                  manifest_errors.append(f'manifest icon not found: {src}')

          html = Path('index.html').read_text(encoding='utf-8')
          required_html = {
              'doctype': '<!DOCTYPE html>',
              'viewport meta': 'name="viewport"',
              'page title': '<title>',
              'manifest link': 'rel="manifest"',
          }
          for label, needle in required_html.items():
              if needle.lower() not in html.lower():
                  manifest_errors.append(f'missing essential HTML metadata: {label}')

          class LocalRefParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('href', 'src'):
                      value = attrs.get(key)
                      if value:
                          self.refs.append((tag, key, value.strip()))

          parser = LocalRefParser()
          parser.feed(html)

          ignored_schemes = {'http', 'https', 'mailto', 'tel', 'data', 'javascript'}
          broken_refs = []

          for tag, attr, raw in parser.refs:
              if not raw or raw.startswith('#') or raw.startswith('//'):
                  continue

              parsed = urlsplit(raw)
              if parsed.scheme.lower() in ignored_schemes:
                  continue
              if parsed.scheme:
                  continue

              path = parsed.path
              if not path or path == '/':
                  continue

              local = Path(path.lstrip('/')).as_posix()
              local_path = root / local

              if local_path.is_dir():
                  local_path = local_path / 'index.html'

              if not local_path.exists():
                  broken_refs.append(f'<{tag}> {attr}="{raw}" -> {local_path}')

          errors = manifest_errors + broken_refs
          if errors:
              print('Static-site validation failed:')
              for error in errors:
                  print(f'  - {error}')
              sys.exit(1)

          print('Static-site validation passed.')
          print(f'Checked {len(required)} required files and {len(parser.refs)} HTML href/src references.')
          PY

      - name: Validate JavaScript and shared portfolio data
        shell: bash
        run: |
          set -euo pipefail

          node --check portfolio-data.js
          node --check portfolio-store.js
          node --check firebase-sync.js

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const dataSource = fs.readFileSync('portfolio-data.js', 'utf8');
          const sandbox = { window: {} };
          vm.createContext(sandbox);
          vm.runInContext(dataSource, sandbox);

          const data = sandbox.window.TRVKC_PORTFOLIO_DEFAULTS;
          if (!data || data.schemaVersion !== 1) throw new Error('Invalid portfolio schema version');
          if (!Array.isArray(data.tools) || !Array.isArray(data.creative)) throw new Error('Portfolio collections must be arrays');

          const accents = new Set(['volt', 'cyan', 'magenta', 'amber']);
          for (const item of [...data.tools, ...data.creative]) {
            if (!item.id || !item.title || !item.url) throw new Error('Every portfolio item needs id, title, and url');
            if (!accents.has(item.accent)) throw new Error(`Unsupported accent on ${item.id}: ${item.accent}`);
            const url = new URL(item.url);
            if (!['http:', 'https:'].includes(url.protocol)) throw new Error(`Unsafe URL on ${item.id}`);
          }

          const html = fs.readFileSync('index.html', 'utf8');
          const firebase = fs.readFileSync('firebase-sync.js', 'utf8');
          const rules = fs.readFileSync('firestore.rules', 'utf8');
          if (!html.includes('firebase-sync.js')) throw new Error('Firebase bridge is not loaded by index.html');
          if (!firebase.includes("const ADMIN_EMAIL = 'cryptotrvkc@gmail.com'")) throw new Error('Approved editor email is missing');
          if (!firebase.includes("const DOCUMENT_PATH = ['portfolio', 'public']")) throw new Error('Firestore document path is missing');
          if (!rules.includes('match /portfolio/public')) throw new Error('Firestore public document rule is missing');
          if (!rules.includes("request.auth.token.email == 'cryptotrvkc@gmail.com'")) throw new Error('Firestore editor allowlist is missing');
          const outerMarker = '  <script>\n  (function () {';
          const outerStart = html.indexOf(outerMarker);
          const outerEnd = html.lastIndexOf('\n  </script>');
          if (outerStart < 0 || outerEnd <= outerStart) throw new Error('Main inline script not found');
          new Function(html.slice(outerStart + '  <script>\n'.length, outerEnd));

          const funMarker = 'const funnyPortfolioHTML = `';
          const funStart = html.indexOf(funMarker);
          const funEnd = html.indexOf('`;\n  })();', funStart);
          if (funStart < 0 || funEnd <= funStart) throw new Error('Embedded Fun-mode document not found');
          const literal = html.slice(funStart + funMarker.length, funEnd);
          const funHtml = new Function('return `' + literal + '`;')();
          const scriptStart = funHtml.lastIndexOf('<script>');
          const scriptEnd = funHtml.lastIndexOf('</script>');
          if (scriptStart < 0 || scriptEnd <= scriptStart) throw new Error('Fun-mode inline script not found');
          new Function(funHtml.slice(scriptStart + '<script>'.length, scriptEnd));

          console.log(`JavaScript validation passed for ${data.tools.length} projects and ${data.creative.length} creative links.`);
          NODE
